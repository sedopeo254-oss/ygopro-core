name: Add logical-player dice choice

on:
  push:
    branches:
      - automation/add-logical-dice-choice-20260812

permissions:
  contents: write

concurrency:
  group: add-logical-dice-choice-20260812
  cancel-in-progress: false

jobs:
  apply-test-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add logical-player number selection API
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin stable/3v1-replay-targeting-fixed
          git checkout -B publish-target origin/stable/3v1-replay-targeting-fixed

          python3 - <<'PY'
          from pathlib import Path

          path = Path('libduel.cpp')
          text = path.read_text()
          function_name = 'LUA_STATIC_FUNCTION(AnnounceNumberPlayer)'
          if function_name in text:
              raise SystemExit('AnnounceNumberPlayer already exists')

          marker = 'LUA_STATIC_FUNCTION(AnnounceCoin) {'
          if text.count(marker) != 1:
              raise SystemExit(f'unexpected AnnounceCoin marker count: {text.count(marker)}')

          insertion = r'''LUA_STATIC_FUNCTION(AnnounceNumberPlayer) {
	check_action_permission(L);
	check_param_count(L, 2);
	const auto logical_player = lua_get<uint8_t>(L, 1);
	uint8_t selecting_player = logical_player;
	if(pduel->game_field->multiplayer.enabled()) {
		if(logical_player >= MultiplayerState::MAX_PLAYERS
				|| !pduel->game_field->multiplayer.is_active(logical_player))
			return 0;
		selecting_player = pduel->game_field->multiplayer.prompt_player_of(logical_player);
	} else if(logical_player > 1) {
		return 0;
	}
	if(selecting_player == MultiplayerState::NO_PLAYER)
		return 0;
	pduel->game_field->core.select_options.clear();
	lua_iterate_table_or_stack(L, 2, lua_gettop(L),
			[L, &select_options = pduel->game_field->core.select_options] {
				select_options.push_back(lua_get<uint64_t>(L, -1));
			});
	if(pduel->game_field->core.select_options.empty())
		return 0;
	pduel->game_field->emplace_process<Processors::AnnounceNumber>(selecting_player);
	return yieldk({
		const auto selected = pduel->game_field->returns.at<int32_t>(0);
		if(selected < 0
				|| static_cast<size_t>(selected) >= pduel->game_field->core.select_options.size())
			return 0;
		lua_pushinteger(L, pduel->game_field->core.select_options[selected]);
		lua_pushinteger(L, selected);
		return 2;
	});
}
'''
          text = text.replace(marker, insertion + marker, 1)
          path.write_text(text)
          PY

          git diff --check
          grep -Fq 'LUA_STATIC_FUNCTION(AnnounceNumberPlayer)' libduel.cpp
          grep -Fq 'prompt_player_of(logical_player)' libduel.cpp
          grep -Fq 'Processors::AnnounceNumber>(selecting_player)' libduel.cpp

      - name: Run stable multiplayer tests
        shell: bash
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive
          sh ./tests/run_multiplayer_state_tests.sh
          sh ./tests/run_multiplayer_field_tests.sh

      - name: Publish tested core
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sedopeo254-oss"
          git config user.email "sedopeo254@gmail.com"
          git add -- libduel.cpp
          git diff --cached --check
          git commit -m "Add logical-player dice number selection"
          git push origin HEAD:stable/3v1-replay-targeting-fixed
